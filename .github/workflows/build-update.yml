name: Build and publish STARSS AURA

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'go.mod'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Reconstruct source
        shell: bash
        run: |
          cat build/source.part.* | base64 -d | gzip -d > main.go
          test -s main.go
          grep -q 'appVersion = "0.5.0"' main.go

      - name: Build Windows EXE
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o STARSS_AURA.exe .
          test -s STARSS_AURA.exe

      - name: Generate update manifest
        shell: bash
        run: |
          SHA="$(sha256sum STARSS_AURA.exe | awk '{print $1}')"
          VERSION="$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go | head -1)"
          cat > update.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://raw.githubusercontent.com/Starss17/STARSS-AURA/main/STARSS_AURA.exe",
            "sha256": "$SHA",
            "notes": "Valorant real via Riot Client local, Riot ID Starss#MGBAY configurável, overlay de rank no estilo do antigo Live Tracker, popup de atualização e facas somente em modo preview."
          }
          EOF

      - name: Publish EXE and manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f STARSS_AURA.exe update.json
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          VERSION="$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go | head -1)"
          git commit -m "Publish STARSS AURA v${VERSION}"
          git push
