name: Build and publish STARSS AURA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Reconstruct verified v0.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web main.go platform_windows.go platform_linux.go
          cat build/v060.part.00 build/v060.part.01 | base64 -d | tar -xz
          test -s main.go
          test -s platform_windows.go
          test -s web/index.html
          grep -q 'appVersion  = "0.6.0"' main.go

      - name: Apply v0.6.1 fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('main.go')
          s = p.read_text(encoding='utf-8')
          old_version = 'appVersion  = "0.6.0"'
          assert old_version in s, 'v0.6 version marker not found'
          s = s.replace(old_version, 'appVersion  = "0.6.1"', 1)

          old_pd = '\tpd := "https://pd." + region + ".a.pvp.net"'
          old_glz = '\tglz := "https://glz-" + region + "-1." + region + ".a.pvp.net"'
          assert old_pd in s, 'PD route line not found'
          assert old_glz in s, 'GLZ route line not found'
          new_pd = '\trouteRegion := region\n\tif routeRegion == "br" {\n\t\trouteRegion = "na"\n\t}\n\tpd := "https://pd." + routeRegion + ".a.pvp.net"'
          new_glz = '\tglz := "https://glz-" + routeRegion + "-1." + routeRegion + ".a.pvp.net"'
          s = s.replace(old_pd, new_pd, 1)
          s = s.replace(old_glz, new_glz, 1)
          p.write_text(s, encoding='utf-8')

          assert 'appVersion  = "0.6.1"' in s
          assert 'if routeRegion == "br"' in s
          assert 'routeRegion = "na"' in s
          print('Patched v0.6.1: BR UI region now routes through Riot NA shard')

      - name: Verify non-fake Valorant behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Starss#MGBAY' web/index.html
          grep -q 'routeRegion == "br"' main.go
          grep -q 'routeRegion = "na"' main.go
          grep -q 'pd." + routeRegion' main.go
          grep -q 'glz-" + routeRegion' main.go

      - name: Build Windows EXE
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o STARSS_AURA.exe .
          test -s STARSS_AURA.exe

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum STARSS_AURA.exe | awk '{print $1}')"
          VERSION="$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go | head -1)"
          cat > update.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://raw.githubusercontent.com/Starss17/STARSS-AURA/main/STARSS_AURA.exe",
            "sha256": "$SHA",
            "notes": "v0.6.1: base sem flicker; botões HTML reais; tracker Riot local sem dados fake; Brasil roteado corretamente pelo shard NA; Riot ID padrão Starss#MGBAY; overlay reconstruída; facas somente preview."
          }
          EOF
          cat update.json

      - name: Publish EXE and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f STARSS_AURA.exe update.json
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git commit -m 'Publish STARSS AURA v0.6.1'
          git push
