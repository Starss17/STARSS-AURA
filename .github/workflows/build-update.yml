name: Build and publish STARSS AURA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct known-good v0.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web main.go platform_windows.go platform_linux.go
          cat build/v060.part.00 build/v060.part.01 | base64 -d | tar -xz
          test -s main.go
          test -s platform_windows.go
          test -s web/index.html
          grep -q 'appVersion  = "0.6.0"' main.go

      - name: Inspect Valorant region routing
        shell: bash
        run: |
          echo '--- platform_windows.go ---'
          grep -nEi 'br1|latam|americas|shard|region|pd\.' platform_windows.go || true
          echo '--- main.go ---'
          grep -nEi 'br1|latam|americas|shard|region|pd\.' main.go || true
          echo '--- web/index.html ---'
          grep -nEi 'br1|latam|americas|shard|region|pd\.' web/index.html || true
          exit 1
