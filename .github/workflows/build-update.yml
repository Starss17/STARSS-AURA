name: Build and publish STARSS AURA

on:
  push:
    branches: [main]
    paths:
      - 'build/v061.part.00'
      - 'build/v061.part.01'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Reconstruct v0.6.1 project
        shell: bash
        run: |
          rm -rf web main.go platform_windows.go platform_linux.go
          cat build/v061.part.00 build/v061.part.01 | base64 -d | tar -xz
          test -s main.go
          test -s platform_windows.go
          test -s web/index.html
          grep -q 'appVersion  = "0.6.1"' main.go

      - name: Build Windows EXE
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o STARSS_AURA.exe .
          test -s STARSS_AURA.exe

      - name: Generate update manifest
        shell: bash
        run: |
          SHA="$(sha256sum STARSS_AURA.exe | awk '{print $1}')"
          VERSION="$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go | head -1)"
          cat > update.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://raw.githubusercontent.com/Starss17/STARSS-AURA/main/STARSS_AURA.exe",
            "sha256": "$SHA",
            "notes": "v0.6.1: interface refeita sem flicker e botões reais; tracker Riot local corrigido para o shard BR→NA; overlay reconstruída; facas apenas preview."
          }
          EOF

      - name: Publish EXE and manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f STARSS_AURA.exe update.json
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          VERSION="$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go | head -1)"
          git commit -m "Publish STARSS AURA v${VERSION}"
          git push
